<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#0d1b2a"/>
      <rect width="10" height="10" fill="#132840"/>
      <rect x="10" y="10" width="10" height="10" fill="#132840"/>
    </pattern>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="900" height="220" fill="url(#pixelGrid)"/>
  <rect width="900" height="220" fill="url(#topGlow)"/>

  <!-- borda pixelada -->
  <g fill="#FFD43B">
    <rect x="0" y="0" width="900" height="8"/>
    <rect x="0" y="212" width="900" height="8"/>
  </g>
  <g fill="#3776AB">
    <rect x="0" y="8" width="8" height="204"/>
    <rect x="892" y="8" width="8" height="204"/>
  </g>

  <!-- cobrinha pixel art -->
  <g>
    <rect x="60" y="150" width="18" height="18" fill="#FFD43B"/>
    <rect x="78" y="150" width="18" height="18" fill="#FFD43B"/>
    <rect x="96" y="132" width="18" height="18" fill="#3776AB"/>
    <rect x="96" y="150" width="18" height="18" fill="#3776AB"/>
    <rect x="114" y="132" width="18" height="18" fill="#FFD43B"/>
    <rect x="114" y="114" width="18" height="18" fill="#FFD43B"/>
    <rect x="132" y="114" width="18" height="18" fill="#3776AB"/>
    <rect x="132" y="96" width="18" height="18" fill="#3776AB"/>
    <rect x="150" y="96" width="18" height="18" fill="#FFD43B"/>
    <!-- cabeça -->
    <rect x="168" y="96" width="18" height="18" fill="#FFF6D9"/>
    <rect x="180" y="90" width="6" height="6" fill="#0d1b2a"/>
  </g>

  <!-- estrelinhas pixel -->
  <g fill="#FFD43B" opacity="0.9">
    <rect x="740" y="40" width="6" height="6"/>
    <rect x="800" y="70" width="6" height="6"/>
    <rect x="770" y="150" width="6" height="6"/>
    <rect x="830" y="120" width="6" height="6"/>
    <rect x="700" y="100" width="6" height="6"/>
  </g>

  <!-- texto principal -->
  <text x="450" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" font-weight="bold" fill="#FFD43B" letter-spacing="2">
    OI, EU SOU O TIAGO 👋
  </text>
  <text x="450" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#8ECAE6" letter-spacing="3">
    &gt;&gt; FUTURO DEV BACKEND PYTHON 🐍
  </text>
  <text x="450" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#5B7A99" letter-spacing="1">
    [ AWS ] [ IA GENERATIVA ] [ GIT &amp; GITHUB ]
  </text>
</svg>
